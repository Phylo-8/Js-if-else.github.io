<!DOCTYPE HTML>
<html>
	<head>
		<title>
			To change the No on click of button
		</title>
	</head>
		
	<body>
		<button type="button" onclick="calc()">Click Me</button>
		<br><br>
		<div id="ans1"></div>
		<br><br>
		<script>
			var a = 10; 
			var b = 10;
			function calc()
			{
				if(a > 1)
				{
					document.getElementById('ans1').innerHTML = a * b;
					a--;
				}
				else if (b > 0)
				{
					document.getElementById('ans1').innerHTML = a * b;
					a = 10;
					b--;
				}
			}  
	
		</script>
	</body>
</html>
