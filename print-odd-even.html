		<script>
			function calc()
			{
				var a = document.getElementById('value').value;
					if(a == 0 )    
					{
						document.getElementById('ans').innerHTML = 'This no is nor odd or even';
					}
					else if(a % 2 == 0)
					{
						document.getElementById('ans').innerHTML = 'This no is even';
					}
					else

						document.getElementById('ans').innerHTML = 'This no is odd';
